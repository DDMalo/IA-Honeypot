[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "honeypot-ai"
version = "0.4.0"
description = "SSH/Telnet honeypot with AI-powered attack classification and MITRE ATT&CK mapping"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.14.1",
    "sqlalchemy>=2.1.6",
    "alembic>=1.20.1",
    "psycopg[binary]>=3.3.6",
    "geoip2>=5.3.0",
    "httpx>=0.28.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.2",
    "mypy>=2.4.0",
    "pre-commit>=4.7.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/honeypot_ai"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S101",  # assert is fine in tests
    "S105",  # fake credentials in fixtures are the point
    "S106",
]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
