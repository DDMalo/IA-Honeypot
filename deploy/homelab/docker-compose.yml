# Homelab services.
#
# Everything here is bound to 127.0.0.1 on purpose. Docker publishes ports by
# inserting its own firewall rules ahead of ufw, so a port published on
# 0.0.0.0 is reachable from the whole network regardless of what ufw says.
# Binding to loopback is what actually keeps these services private; reach them
# from elsewhere over the tunnel with an SSH port forward.
#
# Credentials come from the repository's .env through `env_file`, which hands
# them to the container without Compose having to interpolate them. Writing
# them as ${VARIABLES} instead would force every `docker compose` invocation —
# including `ps` and `logs` — to be given the same --env-file, which is easy to
# forget and fails confusingly.

services:
  postgres:
    image: postgres:16-alpine
    container_name: honeypot-postgres
    restart: unless-stopped
    env_file:
      - ../../.env
    environment:
      # Collation and encoding are fixed here so the database is reproducible
      # on any host, rather than inheriting the machine's locale.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # $$ escapes the dollar so Compose leaves it alone: the variable is
      # resolved inside the container, where env_file has already set it.
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    # The laptop has 8 GB and will later run a local model as well; Postgres
    # does not get to assume it owns the machine.
    shm_size: 256mb
    command:
      - postgres
      - -c
      - shared_buffers=256MB
      - -c
      - max_connections=50
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  grafana:
    image: grafana/grafana-oss:11.6.0
    container_name: honeypot-grafana
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ../../.env
    environment:
      # The datasource file reads these; Grafana substitutes them at load time,
      # so the password never appears in a committed file.
      POSTGRES_HOST_FOR_GRAFANA: postgres:5432
      # Nobody signs up for a single-user dashboard, and anonymous viewers would
      # be reading attacker IP addresses.
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Optional, and off by default: this machine has 3.2 GB of RAM and already
  # runs PostgreSQL and Grafana, so a model is something you turn on when you
  # want it rather than something that competes for memory all day.
  #
  #   docker compose --profile llm up -d
  #
  # Running Ollama natively instead of in a container is also reasonable and a
  # little faster; the provider only needs OLLAMA_HOST to point at it.
  ollama:
    image: ollama/ollama:latest
    container_name: honeypot-ollama
    restart: unless-stopped
    profiles: ["llm"]
    ports:
      # Loopback only, like everything else here. A model endpoint with no
      # authentication is not something to expose to the home network.
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama-models:/root/.ollama
    environment:
      # One model in memory at a time, unloaded five minutes after its last
      # use. The defaults assume a machine with room to spare; this one has
      # none, and a model that lingers is a model competing with Postgres.
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_KEEP_ALIVE: "2m"
    deploy:
      resources:
        limits:
          # Below what the machine has, not above it. A limit larger than
          # total RAM is not a limit: the kernel runs out first and kills
          # whatever looks biggest, which on this host is PostgreSQL.
          memory: 2g
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres-data:
    name: honeypot-postgres-data
  grafana-data:
    name: honeypot-grafana-data
  ollama-models:
    name: honeypot-ollama-models
