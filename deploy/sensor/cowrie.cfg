# Cowrie configuration for this deployment.
# Only the values that differ from cowrie.cfg.dist are set here.

[honeypot]
# Hostname shown to the attacker once "logged in". A plausible, boring name
# invites more interaction than anything that looks like a research box.
hostname = srv-db01

# Report the fake filesystem timestamps relative to the real clock.
timezone = UTC

# Keep the fake filesystem and userdb that ship with the image.
# Attackers who poke around see a consistent Debian-like system.

[ssh]
enabled = true
listen_endpoints = tcp:2222:interface=0.0.0.0

# SSH version string presented to the attacker.
version = SSH-2.0-OpenSSH_9.6p1 Debian-4

# --- Containment ---------------------------------------------------------
# Port forwarding is what turns a honeypot into an attack relay: an attacker
# opens a tunnel and suddenly the traffic hitting someone else's server comes
# from us. All three forms are disabled.
forwarding = false
forward_redirect = false
forward_tunnel = false

# Disable SFTP and exec-only sessions? No: both are kept enabled, because
# how attackers use them is exactly what this project wants to observe.
sftp_enabled = true

[telnet]
enabled = true
listen_endpoints = tcp:2223:interface=0.0.0.0

[output_jsonlog]
# The JSON log is the input to the whole analysis pipeline. One event per
# line, easy to stream and parse.
enabled = true
logfile = ${honeypot:log_path}/cowrie.json
epoch_timestamp = true

[output_textlog]
enabled = false
