# Dependabot checks weekly for outdated or vulnerable dependencies
# and opens pull requests against the develop branch.
version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    target-branch: develop
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    labels: ["dependencies"]
    open-pull-requests-limit: 5
    groups:
      dev-tools:
        patterns: ["pytest*", "ruff", "mypy", "pre-commit"]

  - package-ecosystem: github-actions
    directory: "/"
    target-branch: develop
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    labels: ["dependencies"]
